<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D4 Teknik Manufaktur — Politeknik Negeri Padang</title>
<meta name="description" content="Program Studi Sarjana Terapan (D4) Teknik Manufaktur, Politeknik Negeri Padang — terakreditasi Unggul. Manufaktur cerdas dan manufaktur hijau.">
<style>html,body{margin:0;background:#e6ebf2}</style>
</head>
<body>
<!-- =====================================================================
  BERANDA · Program Studi D4 Teknik Manufaktur · Politeknik Negeri Padang
  Dwibahasa ID/EN · bersuara (Ardi / Ryan) · tombol Jeda
  Untuk WordPress: tempel SELURUH isi berkas ini ke satu blok "HTML Khusus" (Custom HTML).
  Pengaturan (tautan laman 2–6, folder audio, kontak) ada di bagian KONFIG di bawah.
  ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   BERANDA D4 TEKNIK MANUFAKTUR PNP — gaya neumorfisme
   SELURUH aturan diawali #tmb agar tidak bentrok dengan tema WordPress.
   ON = tertekan ke dalam, warna lebih gelap · OFF = timbul, warna terang
   ========================================================= */
#tmb{--bg:#e6ebf2;--ink:#1b2433;--muted:#5b6678;--panel:#eef2f7;--sd:rgba(70,86,112,.28);--sl:rgba(255,255,255,.95);
  --biru:#1565C0;--hijau:#2E7D32;--jingga:#E8590C;
  background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;font-size:15px;text-align:left;-webkit-font-smoothing:antialiased;border-radius:0;overflow-x:clip}
#tmb *,#tmb *::before,#tmb *::after{box-sizing:border-box}
#tmb h1,#tmb h2,#tmb h3,#tmb h4,#tmb p,#tmb ul,#tmb ol,#tmb dl,#tmb dd,#tmb figure,#tmb blockquote{margin:0;padding:0;border:0;background:none;font-family:inherit;color:inherit;letter-spacing:normal;text-transform:none}
#tmb ul,#tmb ol{list-style:none}
#tmb a{color:inherit;text-decoration:none;box-shadow:none;border:0}
#tmb img{max-width:100%;height:auto;display:block;border:0;box-shadow:none}
#tmb button{font:inherit;color:inherit;margin:0;text-transform:none;letter-spacing:normal;line-height:1.3;min-height:0;width:auto;cursor:pointer;-webkit-appearance:none;appearance:none}
#tmb svg{display:block}
#tmb .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 56px}
#tmb [id^="tmb-"]{scroll-margin-top:84px}

/* ---------- bilah atas: bahasa · putar · suara · jeda · hentikan ---------- */
#tmb .bar{position:sticky;top:0;z-index:50;background:rgba(230,235,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(70,86,112,.12)}
#tmb .bar-in{max-width:1240px;margin:0 auto;padding:9px 16px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
#tmb .seg{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:var(--panel);box-shadow:inset 3px 3px 7px rgba(70,86,112,.2),inset -3px -3px 7px #fff}
#tmb .seg .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px 0 8px;align-self:center}
#tmb .lang{border:0;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:800;background:var(--bg);color:var(--ink);
  box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);transition:all .15s}
#tmb .lang[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,#1E5BB0,#0A2F66);transform:translateY(1px);
  box-shadow:inset 3px 3px 7px rgba(0,0,0,.45),inset -2px -2px 5px rgba(255,255,255,.12)}
#tmb .ctl{border:0;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:800;color:var(--ink);background:var(--bg);
  box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl);transition:all .15s;white-space:nowrap}
#tmb .ctl:active,#tmb .ctl[aria-pressed="true"]{transform:translateY(2px);box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}
#tmb .ctl:disabled{opacity:.42;cursor:not-allowed;box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);transform:none}
#tmb .ctl.urut[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,#43A047,#1B5E20);box-shadow:inset 4px 4px 9px rgba(0,0,0,.42),inset -2px -2px 6px rgba(255,255,255,.18)}
#tmb .kendali{display:inline-flex;gap:8px;margin-left:auto}
#tmb .ctl.jeda{min-width:116px}
#tmb .ctl.jeda[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,#E8A33D,#B36A00);
  box-shadow:inset 4px 4px 9px rgba(0,0,0,.42),inset -2px -2px 6px rgba(255,255,255,.18);transform:translateY(2px)}
#tmb .vpanel{max-width:1240px;margin:0 auto;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:12.5px;font-weight:700;color:#3a4558}
#tmb .vpanel[hidden]{display:none}
#tmb .vpanel select{font:inherit;font-size:12.5px;border:0;border-radius:10px;padding:7px 10px;background:var(--panel);color:var(--ink);max-width:330px;
  box-shadow:inset 2px 2px 5px rgba(70,86,112,.2),inset -2px -2px 5px #fff}
#tmb .vpanel input[type=range]{width:110px;accent-color:#1565C0}
#tmb .vhint{flex-basis:100%;font-size:12px;color:#8a4b00}
#tmb .vhint.ok{color:#2e6b3a}
@media (max-width:760px){#tmb .kendali{margin-left:0}#tmb .ctl{padding:8px 11px;font-size:12.5px}#tmb .ctl.jeda{min-width:0}}

/* ---------- kop: tiga lambang tinggi seragam ---------- */
#tmb .kop{--lg:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;background:var(--panel);border-radius:22px;
  padding:16px 22px;margin:14px 0 14px;box-shadow:8px 8px 18px var(--sd),-8px -8px 18px var(--sl)}
#tmb .logos{display:flex;align-items:center;gap:14px}
#tmb .logos.kiri{justify-content:flex-start}#tmb .logos.kanan{justify-content:flex-end}
#tmb .logo{height:var(--lg);display:flex;align-items:center;justify-content:center}
#tmb .logo img{height:var(--lg);width:auto;max-width:calc(var(--lg)*1.4);object-fit:contain}
#tmb .logos .sep{width:2px;height:calc(var(--lg)*.7);border-radius:2px;background:linear-gradient(transparent,#b8c3d4,transparent)}
#tmb .logo .ph{width:var(--lg);height:var(--lg);border-radius:16px;display:grid;place-items:center;text-align:center;font-size:calc(var(--lg)*.115);line-height:1.2;
  font-weight:800;color:var(--muted);box-shadow:inset 3px 3px 8px rgba(70,86,112,.2),inset -3px -3px 8px #fff;padding:4px}
#tmb .kop .mid{text-align:center}
#tmb .kop .min{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#tmb .kop h1{margin:4px 0 3px;font-size:clamp(19px,2.7vw,29px);font-weight:800;line-height:1.2;letter-spacing:-.01em}
#tmb .kop .sub{font-size:13px;font-weight:700;color:#3a4558}
@media (max-width:900px){#tmb .kop{--lg:64px;gap:12px}}
@media (max-width:620px){#tmb .kop{--lg:48px;grid-template-columns:auto auto;grid-template-areas:"kiri kanan" "mid mid";row-gap:10px;padding:14px}
  #tmb .logos.kiri{grid-area:kiri}#tmb .logos.kanan{grid-area:kanan}#tmb .kop .mid{grid-area:mid}#tmb .logos{gap:10px}}

/* ---------- lompat ---------- */
#tmb .lompat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
#tmb .lompat a{font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:999px;background:var(--panel);color:#2b3448;
  box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);transition:transform .15s}
#tmb .lompat a:hover{transform:translateY(-1px)}

/* ---------- hero ---------- */
#tmb .hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:18px;margin:0 0 20px}
#tmb .hero-txt{position:relative;overflow:hidden;border-radius:24px;padding:30px 30px 26px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(46,125,50,.55),transparent 55%),linear-gradient(150deg,#174EA6 0%,#0B2D63 62%,#0A2246 100%);
  box-shadow:10px 10px 22px rgba(23,46,92,.35),-6px -6px 14px var(--sl)}
#tmb .hero-txt::after{content:"";position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;border-radius:50%;
  border:28px solid rgba(255,255,255,.05)}
#tmb .alis{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B9F6CA;
  background:rgba(255,255,255,.1);padding:5px 11px;border-radius:999px}
#tmb .hero h2{font-size:clamp(25px,3.6vw,40px);line-height:1.13;font-weight:800;letter-spacing:-.02em;margin:14px 0 12px;color:#fff;max-width:20ch}
#tmb .hero .lead{font-size:clamp(14.5px,1.5vw,16.5px);color:rgba(255,255,255,.88);max-width:60ch;margin:0 0 16px}
#tmb .lencana{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
#tmb .lencana span{font-size:12px;font-weight:800;padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}
#tmb .lencana span:first-child{background:#FFD54F;color:#3d2a00;border-color:#FFD54F}
#tmb .hero-aksi{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#tmb .listen{border:0;border-radius:14px;padding:11px 17px;font-size:13.5px;font-weight:800;display:inline-flex;align-items:center;gap:8px;color:#fff;
  background:linear-gradient(145deg,var(--c1,#43A047),var(--c2,#1B5E20));
  box-shadow:5px 5px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4);transition:all .15s}
#tmb .listen svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#tmb .listen[aria-pressed="true"]{background:linear-gradient(145deg,var(--d1,#1B5E20),var(--d2,#0d3311));transform:translateY(2px);
  box-shadow:inset 4px 4px 9px rgba(0,0,0,.45),inset -2px -2px 6px rgba(255,255,255,.12)}
#tmb .listen[aria-pressed="true"] svg{animation:tmbpulse 1s infinite}
#tmb .hero-foto{position:relative;border-radius:24px;overflow:hidden;min-height:280px;background:#c9d3e0;
  box-shadow:10px 10px 22px var(--sd),-6px -6px 14px var(--sl)}
#tmb .hero-foto img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;position:absolute;inset:0}
#tmb .hero-foto figcaption{position:absolute;left:10px;right:10px;bottom:10px;font-size:11.5px;font-weight:700;color:#fff;
  background:rgba(10,25,50,.62);padding:7px 10px;border-radius:10px;line-height:1.35}
@media (max-width:860px){#tmb .hero{grid-template-columns:1fr}#tmb .hero-foto{min-height:300px}#tmb .hero-txt{padding:24px 20px 22px}}

/* ---------- angka kunci ---------- */
#tmb .angka{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 22px}
@media (max-width:760px){#tmb .angka{grid-template-columns:repeat(2,minmax(0,1fr))}}
#tmb .ak{background:var(--panel);border-radius:18px;padding:14px 15px 13px;box-shadow:6px 6px 13px var(--sd),-6px -6px 13px var(--sl);border-top:4px solid var(--c2)}
#tmb .ak .n{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--c2);line-height:1.1}
#tmb .ak .l{font-size:12.5px;font-weight:800;margin-top:4px}
#tmb .ak .s{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.35;margin-top:2px}

/* ---------- pintu per pengunjung ---------- */
#tmb .pintu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:0 0 28px}
#tmb .door{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 15px;border-radius:20px;
  background:linear-gradient(145deg,var(--l1),var(--l2));box-shadow:8px 8px 16px var(--sd),-7px -7px 14px var(--sl),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .15s}
#tmb .door:hover{transform:translateY(-2px)}
#tmb .door b{display:block;font-size:15.5px;font-weight:800;margin-bottom:3px}
#tmb .door span.t{font-size:13px;color:#2b3448;line-height:1.45}
#tmb .door .go{font-size:12px;font-weight:800;color:var(--c2);margin-top:6px;display:block}

/* ---------- lencana lambang ---------- */
#tmb .badge{width:56px;height:56px;border-radius:17px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:4px 5px 10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.55);transition:all .2s}
#tmb .badge svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#tmb .badge svg .f{fill:#fff;stroke:none}
#tmb .badge.sm{width:42px;height:42px;border-radius:13px}#tmb .badge.sm svg{width:27px;height:27px}

/* ---------- pita bagian (asesor / calon / ortu) ---------- */
#tmb .pita{display:flex;align-items:center;gap:14px;margin:30px 0 16px;padding:14px 18px;border-radius:18px;color:#fff;
  background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:6px 6px 14px var(--sd),-5px -5px 12px var(--sl)}
#tmb .pita .no{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
#tmb .pita h2{font-size:clamp(19px,2.3vw,24px);font-weight:800;color:#fff;line-height:1.2}
#tmb .pita p{font-size:13px;opacity:.92;margin-top:2px}
#tmb .pita .badge{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}

/* ---------- kepala sub-bagian ---------- */
#tmb .ghead{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
#tmb .gnum{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:14px;
  box-shadow:3px 3px 8px rgba(0,0,0,.2)}
#tmb .gnum svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#tmb .gnum svg .f{fill:#fff;stroke:none}
#tmb .ghead h3{font-size:18px;font-weight:800;line-height:1.25}
#tmb .ghead .sub{font-size:12.5px;color:var(--muted);font-weight:600}
#tmb .ghead .tx{flex:1;min-width:0}
#tmb .spk{width:36px;height:36px;border:0;border-radius:12px;display:grid;place-items:center;padding:0;flex:none;
  background:var(--bg);color:#3a4558;box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:all .15s}
#tmb .spk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#tmb .spk[aria-pressed="true"]{background:#2E7D32;color:#fff;box-shadow:inset 3px 3px 7px rgba(0,0,0,.4);transform:translateY(1px)}
#tmb .spk[aria-pressed="true"] svg{animation:tmbpulse 1s infinite}
#tmb .lead2{font-size:14px;color:#2b3448;margin:-4px 0 14px;max-width:85ch}
@keyframes tmbpulse{50%{opacity:.25}}
#tmb .sorot{outline:3px solid rgba(46,125,50,.55);outline-offset:6px;border-radius:14px;transition:outline-color .3s}

/* ---------- visi (selalu terpajang) ---------- */
#tmb .visi-g{display:grid;gap:14px}
#tmb .visi{display:flex;gap:18px;align-items:flex-start;background:#fff;border-radius:22px;padding:20px 22px;border-left:8px solid var(--c2);
  box-shadow:8px 8px 18px var(--sd),-6px -6px 14px var(--sl)}
#tmb .visi .vb{flex:1;min-width:0}
#tmb .visi .vl{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c2)}
#tmb .visi blockquote{margin:6px 0 10px;font-size:clamp(16.5px,2vw,21px);font-weight:600;line-height:1.55;color:var(--ink);quotes:none;font-style:normal}
#tmb .visi .vf{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
#tmb .visi .src{font-size:11.5px;font-weight:600;color:var(--muted)}
#tmb .alir{display:flex;justify-content:center;margin:2px 0}
#tmb .alir span{width:4px;height:22px;border-radius:4px;background:linear-gradient(#b8c3d4,#8d9bb2)}
@media (max-width:620px){#tmb .visi{flex-direction:column;padding:16px}}
#tmb .tags{display:flex;flex-wrap:wrap;gap:6px}
#tmb .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:#eef2f7;color:#384356}
#tmb .tag.s{background:var(--c2);color:#fff}

/* ---------- rantai OBE ---------- */
#tmb .rantai{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){#tmb .rantai{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){#tmb .rantai{grid-template-columns:1fr}}
#tmb .mitem{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 13px 12px;border-radius:18px;color:var(--ink);
  background:linear-gradient(145deg,var(--l1),var(--l2));box-shadow:7px 7px 14px var(--sd),-6px -6px 12px var(--sl),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .15s}
#tmb .mitem:hover{transform:translateY(-2px)}
#tmb .mitem .mt{display:flex;align-items:center;justify-content:space-between;gap:8px}
#tmb .mitem .cnt{font-size:11px;font-weight:800;background:rgba(255,255,255,.82);padding:3px 9px;border-radius:8px;white-space:nowrap}
#tmb .mitem .mno{font-size:10.5px;font-weight:800;letter-spacing:.11em;opacity:.7}
#tmb .mitem .mj{font-size:13.5px;font-weight:800;line-height:1.25}
#tmb .mitem .mk{font-size:11.5px;font-weight:600;color:#3f4a5e;line-height:1.35}
#tmb .mitem .go{font-size:11px;font-weight:800;color:var(--c2);margin-top:auto}
#tmb .info3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
#tmb .kotak{background:#fff;border-radius:18px;padding:15px 17px;border-left:6px solid var(--c2);box-shadow:5px 5px 14px rgba(70,86,112,.18)}
#tmb .kotak h4{font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c2);margin-bottom:9px}
#tmb .kv{display:grid;gap:7px}
#tmb .kv div{font-size:13px;color:#24304a;line-height:1.45}
#tmb .kv b{display:block;font-size:12px;font-weight:800;color:#44506a}
#tmb .stat4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#tmb .stat4 div{background:#f3f6fa;border-radius:12px;padding:9px 11px}
#tmb .stat4 b{display:block;font-size:19px;font-weight:800;color:var(--c2);line-height:1.15}
#tmb .stat4 span{font-size:11.5px;font-weight:600;color:#3f4a5e;line-height:1.35;display:block}

/* ---------- tombol ON/OFF (PPM & CPL) ---------- */
#tmb .kendali-p{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 14px}
#tmb .grid{display:grid;gap:14px}
#tmb .grid.ppm{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
#tmb .grid.cpl{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
#tmb .tile{position:relative;text-align:left;color:var(--ink);border:0;border-radius:20px;padding:14px 15px 13px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(145deg,var(--l1),var(--l2));
  box-shadow:8px 8px 16px var(--sd),-7px -7px 14px var(--sl),inset 0 1px 0 rgba(255,255,255,.7);
  transition:background .25s,box-shadow .2s,transform .15s,color .2s;outline-offset:4px}
#tmb .tile:hover{transform:translateY(-2px)}
#tmb .tile:focus-visible{outline:3px solid var(--c2)}
#tmb .tile[aria-pressed="true"]{background:linear-gradient(145deg,var(--d1),var(--d2));color:#fff;
  box-shadow:inset 7px 7px 14px rgba(0,0,0,.45),inset -5px -5px 12px rgba(255,255,255,.1),1px 1px 2px rgba(255,255,255,.6);transform:translateY(3px) scale(.985)}
#tmb .tile .tt{display:flex;align-items:center;justify-content:space-between;gap:8px}
#tmb .tile[aria-pressed="true"] .badge{box-shadow:inset 3px 3px 7px rgba(0,0,0,.4),inset -2px -2px 5px rgba(255,255,255,.18);filter:brightness(.88) saturate(1.1)}
#tmb .state{font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.65);color:#465166;
  box-shadow:2px 2px 4px rgba(0,0,0,.12);white-space:nowrap}

   {judul:"Sikap, Etika, dan Tanggung Jawab Profesi", teks:"Menunjukkan sikap religius, berakhlak mulia, dan berkarakter sesuai nilai-nilai Pancasila, serta menerapkan etika profesi keinsinyuran, tanggung jawab keselamatan dan kesehatan kerja, dan kepatuhan terhadap standar, norma, dan peraturan yang berlaku dalam melaksanakan pekerjaan di bidang teknik manufaktur."},
   {judul:"Pengetahuan Keteknikan", teks:"Mampu menerapkan pengetahuan matematika, sains alam, dasar-dasar keteknikan, dan pengetahuan spesialis bidang teknik manufaktur untuk menyelesaikan permasalahan keteknikan yang terdefinisi secara luas pada lingkup pekerjaannya."},
   {judul:"Analisis Masalah dan Pengambilan Keputusan", teks:"Mampu mengidentifikasi, merumuskan, dan menganalisis secara kritis permasalahan keteknikan yang terdefinisi secara luas pada proses dan sistem manufaktur, menggunakan prinsip keteknikan, data terukur, metode analisis terstandar, dan penelusuran literatur yang relevan, sehingga mencapai kesimpulan yang beralasan, mengambil keputusan yang tepat, serta memberikan pertimbangan dalam memilih di antara berbagai alternatif solusi secara mandiri maupun dalam kelompok."},
   {judul:"Perancangan dan Pengembangan Solusi", teks:"Mampu merancang komponen, perkakas, proses, dan sistem manufaktur beserta sistem otomasi dan kendalinya untuk memenuhi kebutuhan yang ditetapkan sesuai standar nasional maupun internasional yang berlaku, dengan mempertimbangkan kelayakan pembuatan (<i>manufacturability</i>), biaya, keselamatan, serta dampak lingkungan dan keberlanjutan."},
   {judul:"Investigasi, Pengujian, dan Pengendalian Mutu", teks:"Mampu merancang dan melaksanakan pengujian serta pengukuran terhadap material, komponen, dan proses manufaktur dengan metode dan alat ukur terstandar, menganalisis dan menafsirkan data hasil pengujian untuk menarik kesimpulan yang sahih, serta menerapkannya dalam sistem pengendalian dan penjaminan mutu berbasis data."},
   {judul:"Penggunaan dan Pemeliharaan Perangkat Modern", teks:"Mampu memilih, menggunakan, dan memelihara perangkat lunak serta perangkat keras modern bidang manufaktur — meliputi CAD/CAM/CAE, mesin CNC, kendali terprogram (PLC), sistem hidrolik dan pneumatik, sensor dan IoT, SCADA, simulasi sistem robotik, serta perkakas analitik data — dengan memahami keterbatasan masing-masing perangkat dan menjaga keandalan operasinya."},
   {judul:"Keteknikan, Masyarakat, dan Keberlanjutan", teks:"Mampu menilai dampak kegiatan dan solusi manufaktur terhadap masyarakat, keselamatan dan kesehatan kerja, serta lingkungan — termasuk melalui identifikasi bahaya dan penilaian risiko proses — dan menerapkan prinsip efisiensi sumber daya dan energi, pemanfaatan kembali material, serta energi baru terbarukan dalam praktik keteknikan yang berkelanjutan."},
   {judul:"Kerja Tim dan Komunikasi", teks:"Mampu bekerja secara efektif sebagai anggota maupun pemimpin dalam tim kerja yang beragam dan multidisiplin, serta mengomunikasikan gagasan dan hasil kerja teknis secara lisan dan tulisan — dalam bentuk laporan, gambar teknik, dan presentasi — kepada kalangan teknis maupun non-teknis."},
   {judul:"Manajemen Proyek, Ekonomi Teknik, dan Kewirausahaan", teks:"Mampu menerapkan prinsip manajemen proyek, ekonomi teknik, dan kewirausahaan berbasis <i>technopreneur</i> dalam merencanakan, menganggarkan, dan mengendalikan pekerjaan keteknikan — baik melalui perintisan usaha sendiri maupun melalui prakarsa penciptaan nilai di dalam organisasi tempatnya bekerja (<i>intrapreneurship</i>) — termasuk menilai kelayakan teknis dan ekonomis serta mengelola risiko, kontrak, dan rantai pasok, serta memikul tanggung jawab atas pencapaian hasil kerja unit organisasinya."},
   {judul:"Pembelajar Sepanjang Hayat", teks:"Mampu belajar secara mandiri dan berkelanjutan, beradaptasi terhadap perkembangan teknologi dan perubahan peran kerja dengan menunjukkan daya juang dan ketangguhan (<i>resilience</i>), membangun jejaring profesional, serta mengenali dan memenuhi kebutuhan pengembangan diri melalui pendidikan lanjut, pelatihan, dan sertifikasi profesi."}
  ]

   {judul:"Design and Development of Solutions", teks:"Design components, tooling, processes and manufacturing systems — including their automation and control systems — to meet specified needs in accordance with applicable national and international standards, taking into account manufacturability, cost, safety, and environmental and sustainability impacts."},
   {judul:"Investigation, Testing and Quality Control", teks:"Design and conduct tests and measurements of materials, components and manufacturing processes using standardised methods and instruments, analyse and interpret test data to draw valid conclusions, and apply them in data-driven quality control and assurance systems."},
   {judul:"Use and Maintenance of Modern Tools", teks:"Select, use and maintain modern manufacturing software and hardware — including CAD/CAM/CAE, CNC machines, programmable logic controllers (PLC), hydraulic and pneumatic systems, sensors and IoT, SCADA, robotic system simulation and data-analytics tools — with an understanding of each tool’s limitations, and keep them operating reliably."},
   {judul:"Engineering, Society and Sustainability", teks:"Assess the impact of manufacturing activities and solutions on society, occupational safety and health, and the environment — including through hazard identification and process risk assessment — and apply the principles of resource and energy efficiency, material reuse and new and renewable energy in sustainable engineering practice."},
   {judul:"Teamwork and Communication", teks:"Work effectively as a member or leader of diverse, multidisciplinary teams, and communicate technical ideas and work orally and in writing — through reports, engineering drawings and presentations — to technical and non-technical audiences."},
   {judul:"Project Management, Engineering Economics and Entrepreneurship", teks:"Apply the principles of project management, engineering economics and technopreneurial entrepreneurship in planning, budgeting and controlling engineering work — whether by starting their own business or by initiating value creation within the organisation they work for (intrapreneurship) — including assessing technical and economic feasibility and managing risks, contracts and supply chains, and take responsibility for the results of their organisational unit."},
   {judul:"Lifelong Learning", teks:"Learn independently and continuously, adapt to technological developments and changing job roles while showing perseverance and resilience, build professional networks, and recognise and meet their own development needs through further education, training and professional certification."}
  ]
 },

 "id": {
  "BERANDA-SAMBUTAN": "Cerdas berkarya, unggul dalam manufaktur. Selamat datang di Program Studi Sarjana Terapan Teknik Manufaktur, Jurusan Teknik Mesin, Politeknik Negeri Padang. Program studi empat tahun ini terakreditasi Unggul, dan sedang menempuh akreditasi internasional i-a-be-e-e. Kami mendidik ahli manufaktur yang mampu merancang perkakas produksi, memprogram mesin se-en-se dan sistem otomasi, mengendalikan mutu, serta memimpin tim produksi. Dua penciri kami adalah manufaktur cerdas dan manufaktur hijau. Laman ini disusun untuk tiga tamu: asesor, calon mahasiswa, dan orang tua. Silakan memilih pintu yang sesuai.",
  "VISI-PNP": "Visi Politeknik Negeri Padang. Menjadi perguruan tinggi vokasi yang unggul, inovatif, bermartabat, berkearifan lokal, berorientasi pada keberlanjutan, dan berdaya saing internasional.",
  "VISI-PRODI": "Visi Program Studi Sarjana Terapan Teknik Manufaktur. Menjadi program studi Sarjana Terapan Teknik Manufaktur yang unggul, inovatif, dan berdaya saing internasional dalam manufaktur cerdas dan manufaktur hijau, menghasilkan lulusan kompeten, bermartabat, bertakwa kepada Tuhan Yang Maha Esa, dan berkarakter teknoprener.",
  "BERANDA-MUTU": "Kurikulum berbasis capaian pembelajaran. Kurikulum dua ribu dua puluh enam diturunkan berurutan: dari Visi Politeknik Negeri Padang ke Visi Program Studi, lalu empat Profil Profesional Mandiri, sepuluh Capaian Pembelajaran Lulusan, dua puluh enam Pengetahuan, seratus delapan puluh lima Materi Pembelajaran, dan lima puluh dua mata kuliah seberat seratus empat puluh enam es-ka-es. Peta kurikulum i, er, em, a memastikan setiap capaian diperkenalkan, diperkuat, dikuasai, dan diasesmen. Dua puluh lima titik asesmen menilai ketercapaiannya. Bila tiga puluh persen atau lebih mahasiswa belum mencapai skor tiga, tindak lanjut perbaikan wajib dilakukan. Rumusan ini disusun bersama pengguna lulusan, alumni melalui treiser stadi, dan Asosiasi Pengelasan Indonesia, serta mengacu pada Sidni Akord dan ka-ka-en-i jenjang enam.",
  "BERANDA-PROFIL": "Profil Profesional Mandiri. Dalam tiga sampai lima tahun setelah lulus, lulusan kami menjadi pribadi yang kompeten, bermartabat, berdaya saing internasional, bertakwa kepada Tuhan Yang Maha Esa, berkarakter teknoprener, dan berliterasi digital, dengan empat profil. Satu, profesional rekayasa manufaktur, rantai pasok, dan mutu. Dua, profesional otomasi dan transformasi digital manufaktur. Tiga, profesional teknoprener, manajemen proyek, dan konsultansi teknologi manufaktur. Empat, profesional pembelajar sepanjang hayat. Tekan satu profil untuk mendengar rumusan lengkapnya.",
  "BERANDA-CAPAIAN": "Capaian Pembelajaran Lulusan. Sepuluh capaian diukur pada saat mahasiswa lulus, selaras dengan sebelas atribut lulusan Sidni Akord dan deskriptor ka-ka-en-i jenjang enam. Kesepuluhnya adalah: sikap dan etika profesi; pengetahuan keteknikan; analisis masalah dan pengambilan keputusan; perancangan solusi; investigasi, pengujian, dan pengendalian mutu; penggunaan dan pemeliharaan perangkat modern; keteknikan dan keberlanjutan; kerja tim dan komunikasi; manajemen proyek dan kewirausahaan; serta belajar sepanjang hayat. Tekan satu capaian untuk mendengar rumusan lengkapnya.",
  "BERANDA-PEMBEDA": "Mengapa memilih Teknik Manufaktur Politeknik Negeri Padang? Pertama, kamu belajar merancang perkakas produksi: cetakan plastik, press tool, serta jig dan fixture, keahlian yang jarang diajarkan di tempat lain. Kedua, rantai digital manufaktur: dari kad tiga dimensi, kam, sampai mesin se-en-se, ditambah pe-el-se, sensor, ai-o-ti, dan dasar kecerdasan artifisial. Ketiga, manufaktur hijau dan energi terbarukan: proyek akhir dapat memilih jalur turbin air pikohidro atau daur ulang plastik. Keempat, satu semester penuh magang di industri, serta peluang gelar bersama di Cheng Shiu University, Taiwan.",
  "BERANDA-PERJALANAN": "Perjalanan empat tahun. Semester satu dan dua membangun fondasi: gambar teknik, bahan teknik, kerja bangku, pengelasan, ka-tiga, mekanika teknik, dan kad. Semester tiga dan empat masuk ke proses manufaktur, kad-kam dan se-en-se, metrologi dan pengendalian mutu, serta perawatan mesin. Semester lima dan enam mendalami perancangan cetakan, press tool, jig dan fixture, pengecoran, pelapisan, otomasi, energi terbarukan, serta rantai pasok. Semester tujuh, magang penuh di industri. Semester delapan, kepston design atau tugas akhir.",
  "BERANDA-BENGKEL": "Bengkel dan laboratorium. Di politeknik, kamu belajar dengan tangan. Praktik dilakukan di bengkel pemesinan konvensional dan se-en-se, bengkel las, bengkel pengecoran, bengkel elektroplating, laboratorium kad-kam, laboratorium pe-el-se dan otomasi, laboratorium metrologi, dan laboratorium uji bahan. Keselamatan dan kesehatan kerja diajarkan sejak semester pertama, dan alat pelindung diri wajib pada setiap praktik.",
  "BERANDA-MITRA": "Mitra industri dan internasional. Program studi bekerja sama dengan {MITRA}, sebagai tempat magang dan sumber masukan kurikulum. Di tingkat internasional, mahasiswa D4 Teknik Manufaktur mengikuti program INTENSE di Cheng Shiu University, Kaohsiung, Taiwan. INTENSE adalah program pemerintah Taiwan yang memadukan kuliah dengan pengalaman kerja di perusahaan mitra. Peserta memperoleh tunjangan hidup dari perusahaan, upah magang, beasiswa pemerintah untuk biaya kuliah, serta kelas bahasa Mandarin. Setelah lulus, penerima beasiswa bekerja di Taiwan selama masa beasiswanya.",
  "BERANDA-MASUK": "Jalur masuk. Ada tiga jalur utama di Politeknik Negeri Padang. Satu, es-en-be-pe, Seleksi Nasional Berdasarkan Prestasi, berdasarkan nilai rapor serta prestasi akademik atau non-akademik selama di SMA, SMK, atau MA. Dua, es-en-be-te, Seleksi Nasional Berdasarkan Tes, berdasarkan hasil ujian tulis berbasis komputer, u-te-be-ka. Tiga, jalur seleksi mandiri yang dikelola langsung oleh kampus, termasuk seleksi mandiri konsorsium politeknik negeri dan jalur portofolio nilai rapor. Lulusan bergelar Sarjana Terapan Teknik.",
  "PPM-1": "Profil Profesional Mandiri 1. Profesional Rekayasa Manufaktur, Rantai Pasok, dan Mutu. Lulusan menjadi profesional bidang rekayasa manufaktur, rantai pasok, dan mutu yang kompeten dan berdaya saing di industri nasional maupun internasional, mampu merancang, merencanakan, mengoperasikan, mengendalikan, menguji, mengevaluasi, dan mengoptimalkan proses produksi, aliran rantai pasok, serta sistem mutu berbasis data untuk meningkatkan produktivitas, kualitas, efisiensi biaya dan energi, serta keselamatan dan kesehatan kerja; menerapkan prinsip pemanfaatan sumber daya secara efisien dan berkelanjutan, termasuk energi baru terbarukan dan pemanfaatan kembali material; serta mampu memimpin tim kerja pada tingkat penyeliaan hingga manajerial awal.",
  "PPM-2": "Profil Profesional Mandiri 2. Profesional Otomasi dan Transformasi Digital Manufaktur. Lulusan menjadi profesional bidang otomasi dan transformasi digital manufaktur yang mampu merancang, mengintegrasikan, mengoperasikan, memelihara, dan mengembangkan sistem manufaktur otomatis dan cerdas berbasis kendali terprogram, sistem hidrolik dan pneumatik, sensor dan ai-o-ti, serta skada; mampu memprogram dan mensimulasikan sistem robotik industri; serta menguasai rantai digital perancangan hingga manufaktur, yaitu kad, kam, ka-a-e, dan pemesinan se-en-se, dan analitik data untuk meningkatkan keandalan, fleksibilitas, efisiensi, keselamatan, dan daya saing industri.",
  "PPM-3": "Profil Profesional Mandiri 3. Profesional Teknoprener, Manajemen Proyek, dan Konsultansi Teknologi Manufaktur. Lulusan menjadi profesional yang berkarakter kewirausahaan berbasis teknoprener, mampu menciptakan dan mewujudkan nilai, baik melalui perintisan dan pengelolaan usaha maupun melalui prakarsa pengembangan produk, layanan, dan perbaikan di dalam organisasi tempatnya bekerja atau intraprenersyip, dengan menghasilkan gagasan teknologi manufaktur yang inovatif serta layak secara teknis dan ekonomis; mampu merencanakan dan mengendalikan proyek beserta anggaran, kontrak, dan risikonya; serta mampu mengomunikasikan gagasan dan hasil kerja teknis secara efektif, lisan maupun tulisan, kepada pelanggan, vendor, dan pemangku kepentingan, dengan memperhatikan mutu, keselamatan, etika, dan keberlanjutan usaha.",
  "PPM-4": "Profil Profesional Mandiri 4. Profesional Pembelajar Sepanjang Hayat. Lulusan menjadi pribadi yang bertakwa kepada Tuhan Yang Maha Esa, bermartabat, dan menjunjung etika profesi, serta pembelajar sepanjang hayat yang secara mandiri dan berkelanjutan memperbarui pengetahuan dan kompetensinya melalui pendidikan lanjut, pelatihan, dan sertifikasi profesi; beradaptasi terhadap perkembangan teknologi, kebutuhan industri, maupun perubahan peran kerja; menunjukkan daya juang dan ketangguhan, atau resiliensi, dalam menghadapi tekanan dan perubahan; bekerja secara efektif dan kolaboratif dalam tim multidisiplin; membangun jejaring profesional; serta berkontribusi secara bertanggung jawab kepada organisasi, profesi, masyarakat, dan lingkungan.",
  "CPL-1": "Capaian Pembelajaran Lulusan 1. Sikap, Etika, dan Tanggung Jawab Profesi. Menunjukkan sikap religius, berakhlak mulia, dan berkarakter sesuai nilai-nilai Pancasila, serta menerapkan etika profesi keinsinyuran, tanggung jawab keselamatan dan kesehatan kerja, dan kepatuhan terhadap standar, norma, dan peraturan yang berlaku dalam melaksanakan pekerjaan di bidang teknik manufaktur.",
  "CPL-2": "Capaian Pembelajaran Lulusan 2. Pengetahuan Keteknikan. Mampu menerapkan pengetahuan matematika, sains alam, dasar-dasar keteknikan, dan pengetahuan spesialis bidang teknik manufaktur untuk menyelesaikan permasalahan keteknikan yang terdefinisi secara luas pada lingkup pekerjaannya.",
  "CPL-3": "Capaian Pembelajaran Lulusan 3. Analisis Masalah dan Pengambilan Keputusan. Mampu mengidentifikasi, merumuskan, dan menganalisis secara kritis permasalahan keteknikan yang terdefinisi secara luas pada proses dan sistem manufaktur, menggunakan prinsip keteknikan, data terukur, metode analisis terstandar, dan penelusuran literatur yang relevan, sehingga mencapai kesimpulan yang beralasan, mengambil keputusan yang tepat, serta memberikan pertimbangan dalam memilih di antara berbagai alternatif solusi secara mandiri maupun dalam kelompok.",
  "CPL-4": "Capaian Pembelajaran Lulusan 4. Perancangan dan Pengembangan Solusi. Mampu merancang komponen, perkakas, proses, dan sistem manufaktur beserta sistem otomasi dan kendalinya untuk memenuhi kebutuhan yang ditetapkan sesuai standar nasional maupun internasional yang berlaku, dengan mempertimbangkan kelayakan pembuatan, biaya, keselamatan, serta dampak lingkungan dan keberlanjutan.",
  "CPL-5": "Capaian Pembelajaran Lulusan 5. Investigasi, Pengujian, dan Pengendalian Mutu. Mampu merancang dan melaksanakan pengujian serta pengukuran terhadap material, komponen, dan proses manufaktur dengan metode dan alat ukur terstandar, menganalisis dan menafsirkan data hasil pengujian untuk menarik kesimpulan yang sahih, serta menerapkannya dalam sistem pengendalian dan penjaminan mutu berbasis data.",
  "CPL-6": "Capaian Pembelajaran Lulusan 6. Penggunaan dan Pemeliharaan Perangkat Modern. Mampu memilih, menggunakan, dan memelihara perangkat lunak serta perangkat keras modern bidang manufaktur, meliputi kad, kam, ka-a-e, mesin se-en-se, kendali terprogram, sistem hidrolik dan pneumatik, sensor dan ai-o-ti, skada, simulasi sistem robotik, serta perkakas analitik data, dengan memahami keterbatasan masing-masing perangkat dan menjaga keandalan operasinya.",
  "CPL-7": "Capaian Pembelajaran Lulusan 7. Keteknikan, Masyarakat, dan Keberlanjutan. Mampu menilai dampak kegiatan dan solusi manufaktur terhadap masyarakat, keselamatan dan kesehatan kerja, serta lingkungan, termasuk melalui identifikasi bahaya dan penilaian risiko proses, dan menerapkan prinsip efisiensi sumber daya dan energi, pemanfaatan kembali material, serta energi baru terbarukan dalam praktik keteknikan yang berkelanjutan.",
  "CPL-8": "Capaian Pembelajaran Lulusan 8. Kerja Tim dan Komunikasi. Mampu bekerja secara efektif sebagai anggota maupun pemimpin dalam tim kerja yang beragam dan multidisiplin, serta mengomunikasikan gagasan dan hasil kerja teknis secara lisan dan tulisan, dalam bentuk laporan, gambar teknik, dan presentasi, kepada kalangan teknis maupun non-teknis.",
  "CPL-9": "Capaian Pembelajaran Lulusan 9. Manajemen Proyek, Ekonomi Teknik, dan Kewirausahaan. Mampu menerapkan prinsip manajemen proyek, ekonomi teknik, dan kewirausahaan berbasis teknoprener dalam merencanakan, menganggarkan, dan mengendalikan pekerjaan keteknikan, baik melalui perintisan usaha sendiri maupun melalui prakarsa penciptaan nilai di dalam organisasi tempatnya bekerja atau intraprenersyip, termasuk menilai kelayakan teknis dan ekonomis serta mengelola risiko, kontrak, dan rantai pasok, serta memikul tanggung jawab atas pencapaian hasil kerja unit organisasinya.",
  "CPL-10": "Capaian Pembelajaran Lulusan 10. Pembelajar Sepanjang Hayat. Mampu belajar secara mandiri dan berkelanjutan, beradaptasi terhadap perkembangan teknologi dan perubahan peran kerja dengan menunjukkan daya juang dan ketangguhan, atau resiliensi, membangun jejaring profesional, serta mengenali dan memenuhi kebutuhan pengembangan diri melalui pendidikan lanjut, pelatihan, dan sertifikasi profesi."
 },
 "en": {
  "BERANDA-SAMBUTAN": "Creating smartly, excelling in manufacturing. Welcome to the Applied Bachelor Program in Manufacturing Engineering, Department of Mechanical Engineering, Politeknik Negeri Padang. This four-year program is accredited Unggul, meaning excellent, and is currently undergoing international accreditation by I-A-B-E-E. We educate manufacturing specialists who design production tooling, program CNC machines and automation systems, control quality, and lead production teams. Our two distinctive themes are intelligent manufacturing and green manufacturing. This page is written for three kinds of visitor: assessors, prospective students, and parents. Please choose the door that suits you.",
  "VISI-PNP": "The vision of Politeknik Negeri Padang. To become a vocational higher-education institution that is excellent, innovative, dignified, rooted in local wisdom, sustainability-oriented, and internationally competitive.",
  "VISI-PRODI": "The vision of the Applied Bachelor Program in Manufacturing Engineering. To become an applied bachelor program in manufacturing engineering that is excellent, innovative, and internationally competitive in intelligent manufacturing and green manufacturing, producing graduates who are competent, dignified, devoted to God Almighty, and of technopreneurial character.",
  "BERANDA-MUTU": "An outcome-based curriculum. The 2026 curriculum is derived step by step: from the vision of Politeknik Negeri Padang to the program vision, then four program educational objectives, ten program learning outcomes, twenty-six areas of knowledge, one hundred and eighty-five learning materials, and fifty-two courses totalling one hundred and forty-six credits. The I-R-M-A curriculum map ensures that every outcome is introduced, reinforced, mastered, and assessed. Twenty-five assessment points measure attainment. If thirty percent or more of students do not reach a score of three, follow-up improvement is mandatory. These statements were developed with employers, with alumni through a tracer study, and with the Indonesian Welding Association, and they refer to the Sydney Accord and level six of the Indonesian Qualifications Framework.",
  "BERANDA-PROFIL": "Program educational objectives. Within three to five years of graduation, our graduates become persons who are competent, dignified, internationally competitive, devoted to God Almighty, technopreneurial, and digitally literate, in four profiles. One, a manufacturing, supply chain and quality engineering professional. Two, a manufacturing automation and digital transformation professional. Three, a technopreneurship, project management and manufacturing technology consultancy professional. Four, a lifelong learning professional. Select a profile to hear its full statement.",
  "BERANDA-CAPAIAN": "Program learning outcomes. Ten outcomes are measured at graduation, aligned with the eleven graduate attributes of the Sydney Accord and with level six of the Indonesian Qualifications Framework. They are: attitude and professional ethics; engineering knowledge; problem analysis and decision making; design of solutions; investigation, testing and quality control; use and maintenance of modern tools; engineering and sustainability; teamwork and communication; project management and entrepreneurship; and lifelong learning. Select an outcome to hear its full statement.",
  "BERANDA-PEMBEDA": "Why choose Manufacturing Engineering at Politeknik Negeri Padang? First, you learn to design production tooling: plastic injection moulds, press tools, and jigs and fixtures, expertise that is rarely taught elsewhere. Second, the digital manufacturing chain: from 3D CAD and CAM to CNC machines, plus PLC, sensors, IoT, and the basics of artificial intelligence. Third, green manufacturing and renewable energy: the capstone offers a pico-hydro water turbine track or a plastic recycling track. Fourth, a full semester of internship in industry, and a joint-degree opportunity at Cheng Shiu University, Taiwan.",
  "BERANDA-PERJALANAN": "Your four-year journey. Semesters one and two build the foundations: engineering drawing, materials, bench work, welding, occupational safety, engineering mechanics, and CAD. Semesters three and four cover manufacturing processes, CAD-CAM and CNC, metrology and quality control, and machine maintenance. Semesters five and six go deeper into mould design, press tools, jigs and fixtures, casting, coating, automation, renewable energy, and supply chains. Semester seven is a full internship in industry. Semester eight is the capstone design project.",
  "BERANDA-BENGKEL": "Workshops and laboratories. At a polytechnic, you learn with your hands. Practical work takes place in the conventional and CNC machining workshops, the welding workshop, the foundry, the electroplating workshop, and the CAD-CAM, PLC and automation, metrology, and materials testing laboratories. Occupational safety and health is taught from the first semester, and personal protective equipment is required in every practical session.",
  "BERANDA-MITRA": "Industry and international partners. The program works with {MITRA}, as internship hosts and as advisers on the curriculum. Internationally, our students take part in the INTENSE program at Cheng Shiu University, Kaohsiung, Taiwan. INTENSE is a Taiwanese government program that combines university study with work experience at partner companies. Participants receive a living allowance from the company, internship pay, a government scholarship for tuition, and Mandarin classes. After graduation, scholarship recipients work in Taiwan for the length of their scholarship.",
  "BERANDA-MASUK": "Admission routes. Politeknik Negeri Padang has three main routes. One, S-N-B-P, the national selection based on achievement, using school report grades and academic or non-academic achievements. Two, S-N-B-T, the national selection based on test, using the national computer-based written test. Three, the independent selection run by the polytechnic itself, including the state polytechnic consortium selection and a report-grade portfolio route. Graduates receive the degree of Bachelor of Applied Engineering.",
  "PPM-1": "Program educational objective 1. Manufacturing, Supply Chain and Quality Engineering. Graduates become professionals in manufacturing engineering, supply chain and quality who are competent and competitive in national and international industry; able to design, plan, operate, control, test, evaluate and optimise production processes, supply-chain flows and data-driven quality systems to improve productivity, quality, cost and energy efficiency, and occupational safety and health; apply the principles of efficient and sustainable resource use, including new and renewable energy and material reuse; and able to lead work teams from supervisory to early managerial level.",
  "PPM-2": "Program educational objective 2. Manufacturing Automation and Digital Transformation. Graduates become professionals in manufacturing automation and digital transformation, able to design, integrate, operate, maintain and develop automated and intelligent manufacturing systems based on programmable control, P-L-C, hydraulic and pneumatic systems, sensors and I-o-T, and SCADA; able to program and simulate industrial robotic systems; and proficient in the digital chain from design to manufacture, CAD, CAM and CAE and CNC machining, and in data analytics, to improve the reliability, flexibility, efficiency, safety and competitiveness of industry.",
  "PPM-3": "Program educational objective 3. Technopreneurship, Project Management and Manufacturing Technology Consultancy. Graduates become professionals of technopreneurial character, able to create and deliver value, both by starting and managing a business and by initiating product, service and process improvements within the organisation they work for, intrapreneurship, by generating manufacturing technology ideas that are innovative and technically and economically feasible; able to plan and control projects together with their budgets, contracts and risks; and able to communicate ideas and technical work effectively, orally and in writing, to customers, vendors and stakeholders, with due regard for quality, safety, ethics and business sustainability.",
  "PPM-4": "Program educational objective 4. Lifelong Learning. Graduates become persons who are devoted to God Almighty, dignified and uphold professional ethics, and lifelong learners who independently and continuously update their knowledge and competence through further education, training and professional certification; adapt to developments in technology, industry needs and changing job roles; show perseverance and resilience in facing pressure and change; work effectively and collaboratively in multidisciplinary teams; build professional networks; and contribute responsibly to their organisation, profession, society and the environment.",
  "CPL-1": "Program learning outcome 1. Attitude, Ethics and Professional Responsibility. Demonstrate religious attitudes, noble character and conduct consistent with the values of Pancasila, and apply engineering professional ethics, occupational safety and health responsibilities, and compliance with applicable standards, norms and regulations in carrying out work in manufacturing engineering.",
  "CPL-2": "Program learning outcome 2. Engineering Knowledge. Apply knowledge of mathematics, natural science, engineering fundamentals and manufacturing engineering specialist knowledge to solve broadly-defined engineering problems within their scope of work.",
  "CPL-3": "Program learning outcome 3. Problem Analysis and Decision Making. Identify, formulate and critically analyse broadly-defined engineering problems in manufacturing processes and systems, using engineering principles, measured data, standardised analysis methods and relevant literature, to reach substantiated conclusions, make sound decisions and advise on the choice among alternative solutions, independently or in groups.",
  "CPL-4": "Program learning outcome 4. Design and Development of Solutions. Design components, tooling, processes and manufacturing systems, including their automation and control systems, to meet specified needs in accordance with applicable national and international standards, taking into account manufacturability, cost, safety, and environmental and sustainability impacts.",
  "CPL-5": "Program learning outcome 5. Investigation, Testing and Quality Control. Design and conduct tests and measurements of materials, components and manufacturing processes using standardised methods and instruments, analyse and interpret test data to draw valid conclusions, and apply them in data-driven quality control and assurance systems.",
  "CPL-6": "Program learning outcome 6. Use and Maintenance of Modern Tools. Select, use and maintain modern manufacturing software and hardware, including CAD, CAM and CAE, CNC machines, programmable logic controllers, P-L-C, hydraulic and pneumatic systems, sensors and I-o-T, SCADA, robotic system simulation and data-analytics tools, with an understanding of each tool’s limitations, and keep them operating reliably.",
  "CPL-7": "Program learning outcome 7. Engineering, Society and Sustainability. Assess the impact of manufacturing activities and solutions on society, occupational safety and health, and the environment, including through hazard identification and process risk assessment, and apply the principles of resource and energy efficiency, material reuse and new and renewable energy in sustainable engineering practice.",
  "CPL-8": "Program learning outcome 8. Teamwork and Communication. Work effectively as a member or leader of diverse, multidisciplinary teams, and communicate technical ideas and work orally and in writing, through reports, engineering drawings and presentations, to technical and non-technical audiences.",
  "CPL-9": "Program learning outcome 9. Project Management, Engineering Economics and Entrepreneurship. Apply the principles of project management, engineering economics and technopreneurial entrepreneurship in planning, budgeting and controlling engineering work, whether by starting their own business or by initiating value creation within the organisation they work for, intrapreneurship, including assessing technical and economic feasibility and managing risks, contracts and supply chains, and take responsibility for the results of their organisational unit.",
  "CPL-10": "Program learning outcome 10. Lifelong Learning. Learn independently and continuously, adapt to technological developments and changing job roles while showing perseverance and resilience, build professional networks, and recognise and meet their own development needs through further education, training and professional certification."
 }
};

var SP = ("speechSynthesis" in window) ? window.speechSynthesis : null;
var PRIA = { id:/ardi|andika|male|pria|laki/i, en:/ryan|guy|andrew|christopher|eric|brian|davis|roger|steffan|thomas|george|daniel|david|mark|male/i };
var PREF_KEY="visi-ppm-cpl-suara", pref={voice:"",voiceEn:"",rate:0.95};
try{ var pp=JSON.parse(localStorage.getItem(PREF_KEY)||"{}"); for(var k in pp) pref[k]=pp[k]; }catch(e){}
function simpanPref(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }catch(e){} }
var pemutar={}, adaRekaman={}, now=null, token=0, terjeda=false, pendengar=[];

function suaraBhs(){
  if(!SP) return [];
  var re = BHS==="en" ? /^en([-_]|$)/i : /^id([-_]|$)/i;
  return SP.getVoices().filter(function(v){ return re.test(v.lang) || (BHS==="id" && /indones/i.test(v.name)); });
}
function pilihSuara(){
  var vs=suaraBhs(), nama = BHS==="en" ? pref.voiceEn : pref.voice;
  if(nama){ for(var i=0;i<vs.length;i++) if(vs[i].name===nama) return vs[i]; }
  var utama = BHS==="en" ? /ryan|guy|andrew|christopher/i : /ardi/i;
  return vs.find(function(v){return utama.test(v.name);}) || vs.find(function(v){return PRIA[BHS].test(v.name);}) || vs[0] || null;
}
function potong(t){
  var out=[]; String(t).split(/(?<=[.;:?!])\s+/).forEach(function(k){
    if(k.length<=190){ out.push(k); return; }
    var buf=""; k.split(/(?<=,)\s+/).forEach(function(f){ if((buf+" "+f).length>190&&buf){ out.push(buf); buf=f; } else buf=buf?buf+" "+f:f; });
    if(buf) out.push(buf);
  }); return out.filter(Boolean);
}
function kabari(){ pendengar.forEach(function(f){ try{ f(now?now.id:null, terjeda); }catch(e){} }); }
function sedangPutar(id){ return !!now && now.id===id; }
function srcAudio(id){ return KONFIG.audio + String(id).toLowerCase() + (BHS==="en"?"-en":"") + ".mp3"; }
function hentikan(){
  token++; terjeda=false;
  Object.keys(pemutar).forEach(function(k){ var a=pemutar[k]; a.onended=a.onerror=null; a.pause(); try{a.currentTime=0;}catch(e){} });
  if(SP){ try{ SP.resume(); }catch(e){} SP.cancel(); }   /* resume dulu, baru cancel — jebakan yang sudah ditemukan */
  now=null; kabari();
}
function jeda(paksa){
  if(!now) return false;
  var mau = paksa===undefined ? !terjeda : !!paksa;
  if(mau===terjeda) return terjeda;
  if(mau){ if(now.kind==="mp3"){ var a=pemutar[now.key]; if(a) a.pause(); } else if(SP){ try{SP.pause();}catch(e){} } terjeda=true; }
  else   { if(now.kind==="mp3"){ var b=pemutar[now.key]; if(b) b.play().catch(function(){}); } else if(SP){ try{SP.resume();}catch(e){} } terjeda=false; }
  kabari(); return terjeda;
}
function putar(id, selesaiCb){
  hentikan();
  var my=++token, teks=teksSuara(id), key=BHS+":"+id;
  var selesai=function(){ if(my!==token) return; now=null; kabari(); if(selesaiCb) selesaiCb(id); };
  var jatuh=false;
  var bacakan=function(){
    if(my!==token||jatuh) return; jatuh=true;
    if(!SP){ now=null; kabari(); if(selesaiCb) selesaiCb(id); return; }
    now={id:id,kind:"tts",key:key}; kabari();
    var bag=potong(teks), v=pilihSuara(), i=0;
    var lanjut=function(){
      if(my!==token) return;
      if(i>=bag.length) return selesai();
      var u=new SpeechSynthesisUtterance(bag[i++]);
      u.lang=(v&&v.lang)||(BHS==="en"?"en-GB":"id-ID"); if(v) u.voice=v; u.rate=pref.rate;
      u.pitch=(v&&PRIA[BHS].test(v.name))?1:0.8;
      u.onend=lanjut; u.onerror=function(e){ if(e.error==="interrupted"||e.error==="canceled") return; lanjut(); };
      SP.speak(u);
    };
    lanjut();
  };
  if(adaRekaman[key]!==false){
    if(!pemutar[key]){ var a0=new Audio(); a0.preload="none"; a0.src=srcAudio(id); pemutar[key]=a0; }
    var a=pemutar[key];
    now={id:id,kind:"mp3",key:key}; kabari();
    a.onended=selesai;
    a.onerror=function(){ adaRekaman[key]=false; bacakan(); };
    try{a.currentTime=0;}catch(e){}
    a.play().then(function(){ if(my===token){ adaRekaman[key]=true; kabari(); } })
            .catch(function(){ if(my===token){ adaRekaman[key]=false; bacakan(); } });
  } else bacakan();
}
function labelSuara(id){
  var key=BHS+":"+id, v=pilihSuara(), u=L().ui;
  if(adaRekaman[key]===true) return u.rekaman+" · "+srcAudio(id).split("/").pop();
  return u.dibacakan+(v?" · "+v.name.replace(/ - .*$/,"").replace(/^Microsoft /,"").replace(/ Online \(Natural\)/,""):"");
}

  /* visi — selalu terpajang */
  h+='<div id="tmb-visi">'+kepala("1", W.visiPnp, "kampus", t.visi.judul, t.visi.sub)+'</div>';
  h+='<div class="visi-g">'+kartuVisi("VISI-PNP", t.visi.pnp, W.visiPnp, "kampus")+'<div class="alir"><span></span></div>'+kartuVisi("VISI-PRODI", t.visi.prodi, W.visiProdi, "cerdashijau")+'</div>';

  /* rantai OBE */
  h+=kepala("2", W.mutu, "petaIRMA", t.mutu.judul, t.mutu.sub, "BERANDA-MUTU");
  h+='<p class="lead2">'+t.mutu.lead+'</p><div class="rantai">'+t.mutu.rantai.map(function(r,i){
      var luar = r[3].charAt(0)!=="#";
      return '<a class="mitem" href="'+esc(tautan(r[3]))+'" style="'+vars(W.rantai[i])+'"><span class="mt"><span class="badge sm">'+svg(IK.rantai[i])+'</span><span class="cnt">'+r[2]+'</span></span>'+
        '<span class="mno">'+(BHS==="en"?"STEP ":"TAHAP ")+(i+1)+'</span><span class="mj">'+r[0]+'</span><span class="mk">'+r[1]+'</span>'+
        '<span class="go">'+(luar?u.buka+" →":"↑ "+u.dalamLaman)+'</span></a>';
    }).join("")+'</div>';
  h+='<div class="info3">'+
     '<div class="kotak" style="--c2:#1565C0"><h4>'+t.mutu.masukanJudul+'</h4><div class="kv">'+t.mutu.masukan.map(function(m){return '<div><b>'+m[0]+'</b>'+m[1]+'</div>';}).join("")+'</div></div>'+
     '<div class="kotak" style="--c2:#C62828"><h4>'+t.mutu.asesmenJudul+'</h4><div class="stat4">'+t.mutu.asesmen.map(function(m){return '<div><b>'+m[0]+'</b><span>'+m[1]+'</span></div>';}).join("")+'</div>'+
       '<h4 style="margin-top:14px;color:#6A1B9A">'+t.mutu.acuanJudul+'</h4><div class="tags">'+t.mutu.acuan.map(function(a){return '<span class="tag">'+a+'</span>';}).join("")+'</div></div>'+
     '</div>';

  /* PPM — ON/OFF */
  h+=kepala("3", W.ppmInduk, "gearflow", t.ppm.judul, t.ppm.sub, "BERANDA-PROFIL");
  h+='<p class="lead2">'+t.ppm.intro+'</p>';
  h+='<div class="kendali-p"><button class="ctl" type="button" data-semua="ppm">'+u.semuaOn+'</button><button class="ctl" type="button" data-kosong="ppm">'+u.semuaOff+'</button></div>';
  h+='<div class="grid ppm">'+t.ppm.items.map(function(p,i){
      var id="PPM-"+(i+1), on=!!ppmOn[id];
      return '<button class="tile" type="button" data-tile="'+id+'" aria-pressed="'+on+'" style="'+vars(W.ppm[i])+'">'+
        '<span class="tt"><span class="badge">'+svg(IK.ppm[i])+'</span><span class="state">'+(on?"ON":"OFF")+'</span></span>'+
        '<span class="code">'+id+'</span><span class="title">'+p.judul+'</span><span class="rk">'+p.ringkas+'</span></button>';
    }).join("")+'</div><div class="open" id="tmbOpenPPM"></div>';

  /* CPL — ON/OFF */
  h+=kepala("4", W.cplInduk, "target", t.cpl.judul, t.cpl.sub, "BERANDA-CAPAIAN");
  h+='<div class="kendali-p"><button class="ctl" type="button" data-semua="cpl">'+u.semuaOn+'</button><button class="ctl" type="button" data-kosong="cpl">'+u.semuaOff+'</button></div>';
  h+='<div class="grid cpl">'+t.cpl.items.map(function(c,i){
      var id="CPL-"+(i+1), on=!!cplOn[id];
      return '<button class="tile" type="button" data-tile="'+id+'" aria-pressed="'+on+'" style="'+vars(W.cpl[i])+'">'+
        '<span class="tt"><span class="badge sm">'+svg(IK.cpl[i])+'</span><span class="state">'+(on?"ON":"OFF")+'</span></span>'+
        '<span class="code">'+(BHS==="en"?"PLO-":"CPL-")+(i+1)+'</span><span class="title">'+c.judul+'</span><span class="mt2"><span>'+SA[i]+'</span></span></button>';
    }).join("")+'</div><div class="open" id="tmbOpenCPL"></div>';

  /* =================== UNTUK CALON MAHASISWA =================== */
  h+=pita("calon", W.calon, "topi", "2 / 3", t.bagian.calon);
  h+=kepala("1", W.calon, "bintang", t.pembeda.judul, t.pembeda.sub, "BERANDA-PEMBEDA");
  h+='<div class="beda">'+t.pembeda.items.map(function(p,i){
      return '<div class="bd" style="'+vars(W.pembeda[i])+'"><span class="badge">'+svg(IK.pembeda[i])+'</span><b>'+p[0]+'</b><p>'+p[1]+'</p></div>';
    }).join("")+'</div>';

  h+=kepala("2", ["#90CAF9","#0D47A1"], "kalender", t.perjalanan.judul, t.perjalanan.sub, "BERANDA-PERJALANAN");
  h+='<div class="jalan">'+t.perjalanan.smt.map(function(s,i){
      return '<div class="smt'+(i>=6?' besar':'')+'" style="'+vars(W.smt[i])+'"><div class="h"><span class="r">'+ROMAWI[i]+'</span><div><div class="j">'+s[0]+'</div><div class="k">'+SKS[i]+(BHS==="en"?" credits":" sks")+'</div></div></div><p>'+s[1]+'</p></div>';
    }).join("")+'</div><p class="catat"><a href="'+esc(KONFIG.laman.mk)+'">'+t.perjalanan.catatan+' →</a></p>';

  h+=kepala("3", ["#80CBC4","#00695C"], "p11", t.bengkel.judul, t.bengkel.sub, "BERANDA-BENGKEL");
  h+='<div class="bengkel"><figure class="foto"><img src="'+FOTO[1]+'" alt="'+esc(t.bengkel.foto[1])+'"><figcaption>'+t.bengkel.foto[1]+'</figcaption></figure>'+
     '<div class="fas" style="--c2:#00695C"><ul>'+t.bengkel.fasilitas.map(function(f){return '<li>'+f+'</li>';}).join("")+'</ul><div class="k3">⛑ '+t.bengkel.k3+'</div></div></div>';

  h+=kepala("4", ["#EF9A9A","#C62828"], "globe", t.mitra.judul, t.mitra.sub, "BERANDA-MITRA");
  h+='<div class="intl2"><div class="intl"><span class="badge">'+svg("globe")+'</span><div><div class="lb">'+t.mitra.intlLabel+'</div><b class="j">'+t.mitra.intlJudul+'</b><p>'+t.mitra.intlIsi+'</p>'+
     '<ul class="poin">'+t.mitra.intlPoin.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>'+
     '<p class="sumber">'+t.mitra.intlSumber+' <a href="'+esc(KONFIG.intense)+'" target="_blank" rel="noopener">'+t.mitra.intlTautan+' ↗</a></p></div></div>'+
     '<figure class="foto lebar"><img src="'+FOTO[2]+'" alt="'+esc(t.mitra.intlFoto[0])+'"><figcaption>'+t.mitra.intlFoto[0]+'</figcaption></figure>'+
     '<figure class="foto"><img src="'+FOTO[3]+'" alt="'+esc(t.mitra.intlFoto[1])+'"><figcaption>'+t.mitra.intlFoto[1]+'</figcaption></figure></div>';
  h+='<div class="mitra">'+
     '<div class="ind"><div class="lb">'+t.mitra.indLabel+'</div><div class="chips">'+B.mitra.map(function(m){return '<span>'+esc(m)+'</span>';}).join("")+'</div>'+
     '<p class="catat" style="margin-top:12px">'+t.mitra.catatan+'</p></div></div>';

  /* =================== UNTUK ORANG TUA =================== */
  h+=pita("ortu", W.ortu, "rumah", "3 / 3", t.bagian.ortu);
  h+=kepala("1", W.ortu, "topi", t.masuk.judul, t.masuk.sub, "BERANDA-MASUK");
  h+='<div class="masuk">'+t.masuk.items.map(function(m,i){
      return '<div class="jm" style="'+vars(W.masuk[i])+'"><span class="s">'+m[0]+'</span><b>'+m[1]+'</b><p>'+m[2]+'</p></div>';
    }).join("")+'</div><a class="tombol" href="'+esc(KONFIG.pmb)+'" target="_blank" rel="noopener">'+t.masuk.tombol+' ↗</a>';

  h+=kepala("2", ["#FFCC80","#E8590C"], "tanya", t.faq.judul, t.faq.sub);
  h+='<div class="faq" style="--c2:#E8590C">'+t.faq.items.map(function(f,i){
      return '<details'+(i===0?' open':'')+'><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>';
    }).join("")+'</div>';

  var k=KONFIG.kontak, kl=t.kontak.label;
  h+='<div id="tmb-kontak">'+kepala("3", ["#9FA8DA","#283593"], "surat", t.kontak.judul, t.kontak.sub)+'</div>';
  h+='<div class="kontak">'+
     '<div class="kt"><b>'+kl.alamat+'</b>'+isian(k.alamat)+'</div>'+
     '<div class="kt"><b>'+kl.email+'</b>'+isian(k.email, k.email?"mailto:"+k.email:"")+'</div>'+
     '<div class="kt"><b>'+kl.wa+'</b>'+isian(k.wa, k.wa?"https://wa.me/"+String(k.wa).replace(/\D/g,"").replace(/^0/,"62"):"")+'</div>'+
     '<div class="kt"><b>'+kl.ig+'</b>'+isian(k.ig, k.ig?"https://instagram.com/"+String(k.ig).replace(/^@/,""):"")+'</div>'+
     '<div class="kt"><b>'+kl.web+'</b>'+isian(k.web, k.web)+'</div></div>';

  h+='<footer class="kaki">'+t.kaki+'</footer></div>';
  ROOT.innerHTML=h;
  pasang();
}

function kartuVisi(id, v, warna, ikon){
  return '<article class="visi" data-urut="'+id+'" style="'+vars(warna)+'"><span class="badge">'+svg(ikon)+'</span><div class="vb">'+
    '<div class="vl">'+v.label+'</div><blockquote>“'+v.teks+'”</blockquote>'+
    '<div class="tags">'+v.tag.map(function(g){return '<span class="tag s">'+g+'</span>';}).join("")+'</div>'+
    '<div class="vf"><button class="listen" type="button" data-spk="'+id+'" aria-pressed="false">'+SPK+'<span class="lt">'+L().ui.dengarkan+'</span></button>'+
    '<span class="src">'+v.sumber+'</span></div></div></article>';
}

/* ---------- kartu rumusan yang terbuka saat tombol ON ---------- */
function bukaKartu(){
  var t=L(), u=t.ui;
  var o1=ROOT.querySelector("#tmbOpenPPM"), o2=ROOT.querySelector("#tmbOpenCPL");
  o1.innerHTML=t.ppm.items.map(function(p,i){
    var id="PPM-"+(i+1); if(!ppmOn[id]) return "";
    return '<div class="card" style="'+vars(W.ppm[i])+'"><div class="dh"><span class="dot"></span><b>'+id+' · '+p.judul+'</b><span class="aud" data-aud="'+id+'">'+esc(labelSuara(id))+'</span></div>'+
      '<h5>'+u.rumusan+'</h5><p>'+p.teks+'</p><h5>'+u.peran+'</h5><div class="tags">'+p.peran.map(function(r){return '<span class="tag s">'+r+'</span>';}).join("")+'</div></div>';
  }).join("");
  o2.innerHTML=t.cpl.items.map(function(c,i){
    var id="CPL-"+(i+1); if(!cplOn[id]) return "";
    return '<div class="card" style="'+vars(W.cpl[i])+'"><div class="dh"><span class="dot"></span><b>'+(BHS==="en"?"PLO-":"CPL-")+(i+1)+' · '+c.judul+'</b><span class="tag s">'+SA[i]+'</span><span class="aud" data-aud="'+id+'">'+esc(labelSuara(id))+'</span></div>'+
      '<p>'+c.teks+'</p></div>';
  }).join("");
}
function setTile(id, on){
  var peta = id.indexOf("PPM")===0 ? ppmOn : cplOn;
  if(on){ peta[id]=true; hentiUrut(); putar(id); } else { delete peta[id]; if(sedangPutar(id)) hentikan(); }
  var el=ROOT.querySelector('[data-tile="'+id+'"]');
  if(el){ el.setAttribute("aria-pressed", !!on); el.querySelector(".state").textContent = on?"ON":"OFF"; }
  bukaKartu();
}

/* ---------- memasang perilaku setelah render ---------- */
function pasangLogo(id, src, nama){
  var box=ROOT.querySelector("#"+id); if(!box) return; var i=0, list=[].concat(src);
  var img=new Image(); img.alt=nama;
  img.onload=function(){ box.innerHTML=""; box.appendChild(img); };
  img.onerror=function(){ i++; if(i<list.length) img.src=list[i]; else box.innerHTML='<div class="ph">'+nama+'</div>'; };
  img.src=list[0];
}
function segarkanBar(){
  var u=L().ui, b=ROOT.querySelector("#tmbUrut"); if(!b) return;
  b.setAttribute("aria-pressed", urutOn); b.textContent = urutOn ? u.hentiUrut : u.putar;
}
function isiSuara(){
  var sel=ROOT.querySelector("#tmbVsel"), hint=ROOT.querySelector("#tmbHint"), u=L().ui; if(!sel) return;
  if(!SP){ sel.innerHTML="<option>—</option>"; sel.disabled=true; hint.textContent=u.tanpaSuara; return; }
  var vs=suaraBhs(), cur=pilihSuara();
  sel.innerHTML = vs.length ? vs.map(function(v){ return '<option value="'+esc(v.name)+'"'+(cur&&v.name===cur.name?" selected":"")+'>'+esc(v.name)+(PRIA[BHS].test(v.name)?"  ♂":"")+'</option>'; }).join("") : "<option>—</option>";
  var pria=vs.find(function(v){return PRIA[BHS].test(v.name);});
  hint.className="vhint"+(pria?" ok":""); hint.textContent = pria ? u.adaPria+pria.name : u.tanpaPria;
}
function pasang(){
  pasangLogo("tmbLogoK", KONFIG.logoKementerian, "Kemdiktisaintek");
  pasangLogo("tmbLogoD", LOGO_DIKTI, "Diktisaintek Berdampak");
  pasangLogo("tmbLogoP", LOGO_PNP, "Politeknik Negeri Padang");

  ROOT.querySelectorAll("[data-lang]").forEach(function(b){ b.onclick=function(){
    if(b.dataset.lang===BHS) return; hentikan(); urutOn=false; BHS=b.dataset.lang;
    try{ localStorage.setItem("tmb-bahasa",BHS); }catch(e){}
    var y=window.scrollY; render(); window.scrollTo(0,y);
  };});
  ROOT.querySelectorAll("[data-spk]").forEach(function(b){ b.onclick=function(e){ e.preventDefault(); tekan(b.dataset.spk); }; });
  ROOT.querySelectorAll("[data-tile]").forEach(function(b){ b.onclick=function(){ var id=b.dataset.tile, peta=id.indexOf("PPM")===0?ppmOn:cplOn; setTile(id, !peta[id]); }; });
  ROOT.querySelectorAll("[data-semua]").forEach(function(b){ b.onclick=function(){ hentikan(); hentiUrut(); var g=b.dataset.semua, peta=g==="ppm"?ppmOn:cplOn, n=g==="ppm"?4:10;
    for(var i=1;i<=n;i++){ peta[(g==="ppm"?"PPM-":"CPL-")+i]=true; } render(); }; });
  ROOT.querySelectorAll("[data-kosong]").forEach(function(b){ b.onclick=function(){ hentikan(); var g=b.dataset.kosong;
    if(g==="ppm") ppmOn={}; else cplOn={}; render(); }; });

  ROOT.querySelector("#tmbUrut").onclick=function(){
    if(urutOn){ urutOn=false; hentikan(); segarkanBar(); return; }
    urutOn=true; segarkanBar(); mulaiUrut(0);
  };
  ROOT.querySelector("#tmbJeda").onclick=function(){ jeda(); };
  ROOT.querySelector("#tmbStop").onclick=function(){ hentikan(); hentiUrut(); };
  ROOT.querySelector("#tmbSet").onclick=function(){
    var p=ROOT.querySelector("#tmbPanel"); p.hidden=!p.hidden; this.setAttribute("aria-expanded", !p.hidden); this.setAttribute("aria-pressed", !p.hidden); isiSuara();
  };
  ROOT.querySelector("#tmbVsel").onchange=function(e){ if(BHS==="en") pref.voiceEn=e.target.value; else pref.voice=e.target.value; simpanPref(); isiSuara(); };
  var r=ROOT.querySelector("#tmbRate"); r.oninput=function(){ pref.rate=+r.value; ROOT.querySelector("#tmbRateV").textContent=r.value; simpanPref(); };
  ROOT.querySelector("#tmbUji").onclick=function(){ if(!SP) return; hentikan(); var v=pilihSuara(), uu=new SpeechSynthesisUtterance(L().ui.ujiTeks);
    uu.lang=(v&&v.lang)||(BHS==="en"?"en-GB":"id-ID"); if(v) uu.voice=v; uu.rate=pref.rate; uu.pitch=(v&&PRIA[BHS].test(v.name))?1:0.8; SP.speak(uu); };
  isiSuara();
  bukaKartu();
  kabari();
}

/* ---------- keadaan tombol mengikuti suara yang sedang berjalan ---------- */
pendengar.push(function(aktif, dijeda){
  var u=L().ui;
  ROOT.querySelectorAll("[data-spk]").forEach(function(b){
    var on=b.dataset.spk===aktif; b.setAttribute("aria-pressed", on);
    var lt=b.querySelector(".lt");
    if(lt) lt.textContent = on ? u.hentikanSuara : (b.dataset.spk==="BERANDA-SAMBUTAN" ? L().hero.tombol : u.dengarkan);
  });
  ROOT.querySelectorAll("[data-tile]").forEach(function(t){ t.classList.toggle("playing", t.dataset.tile===aktif); });
  ROOT.querySelectorAll("[data-aud]").forEach(function(e){ e.textContent=labelSuara(e.dataset.aud); });
  var bj=ROOT.querySelector("#tmbJeda"), bs=ROOT.querySelector("#tmbStop");
  if(bj){ bj.disabled=!aktif; bs.disabled=!aktif; bj.setAttribute("aria-pressed", !!aktif && !!dijeda); bj.textContent=(aktif&&dijeda)?u.lanjut:u.jeda; }
});

if(SP){ SP.onvoiceschanged=isiSuara; }
render();
})();

</script>

</body>
